openapi: 3.0.3
info:
  title: ZestIQ API
  version: 1.0.0
  description: |
    REST API for ZestIQ inventory, recipes, ordering and AI OCR.
servers:
  - url: http://localhost:4001
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error]

    InventoryItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        currentStock:
          type: number
        unit:
          type: string
        unitCost:
          type: number
        parLevel:
          type: number
        supplier:
          type: string
        reorderPoint:
          type: number
        deletable:
          type: boolean
        lastUpdated:
          type: string
          format: date-time
      required: [id,name,currentStock,unit]

    Recipe:
      type: object
      properties:
        id:
          type: string
        menuItemName:
          type: string
        category:
          type: string
        price:
          type: number
        ingredients:
          type: array
          items:
            type: object
            properties:
              inventoryItemId:
                type: string
              quantity:
                type: number
              unit:
                type: string
        source:
          type: string
        deletable:
          type: boolean
      required: [id,menuItemName,ingredients]

    Supplier:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        contactPerson:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        category:
          type: string
        dateAdded:
          type: string
          format: date-time

    OrderSuggestion:
      type: object
      properties:
        itemId: { type: string }
        itemName: { type: string }
        currentStock: { type: number }
        parLevel: { type: number }
        suggestedQuantity: { type: number }
        unitCost: { type: number }
        totalCost: { type: number }
        supplier: { type: string }
        unit: { type: string }
        priority: { type: string, enum: [critical,high,medium,low] }
        reasoning: { type: string }
        confidence: { type: number }

    InvoiceItem:
      type: object
      properties:
        name: { type: string }
        quantity: { type: number }
        unit: { type: string }
        unitCost: { type: number }
        totalCost: { type: number }
        category: { type: string }

    ExtractedInvoice:
      type: object
      properties:
        vendor: { type: string }
        invoiceNumber: { type: string }
        date: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        total: { type: number }

paths:
  /api/auth/login:
    post:
      summary: Login (returns JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: unauthorized
          content: { 'application/json': { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/inventory:
    get:
      summary: List inventory items
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryItem'
    post:
      summary: Create inventory item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                category: { type: string }
                currentStock: { type: number }
                unit: { type: string }
                unitCost: { type: number }
                parLevel: { type: number }
                supplier: { type: string }
                deletable: { type: boolean }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'

  /api/inventory/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get inventory item
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }
        '404': { description: Not found, content: { 'application/json': { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    put:
      summary: Update inventory item
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: updated, content: { 'application/json': { schema: { $ref: '#/components/schemas/InventoryItem' } } } }
    delete:
      summary: Delete inventory item
      security:
        - bearerAuth: []
      responses:
        '204': { description: deleted }

  /api/inventory/bulk-delete:
    post:
      summary: Delete multiple items (respects deletable flag)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: deleted list
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: array, items: { type: string } }

  /api/inventory/merge:
    post:
      summary: Merge multiple inventory items into a primary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                primaryId: { type: string }
                mergeIds:
                  type: array
                  items: { type: string }
                name: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }

  /api/recipes:
    get:
      summary: List recipes
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'
    post:
      summary: Create recipe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Recipe' }
      responses:
        '201': { description: created, content: { 'application/json': { schema: { $ref: '#/components/schemas/Recipe' } } } }

  /api/suppliers:
    get:
      summary: List suppliers
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  suppliers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supplier'

  /api/orders/suggestions:
    get:
      summary: Get order suggestions (based on inventory, sales, par levels)
      parameters:
        - name: window
          in: query
          schema: { type: integer, default: 7 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSuggestion'

  /api/orders/place:
    post:
      summary: Place an order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      itemId: { type: string }
                      quantity: { type: number }
                supplierId: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string }
                  status: { type: string }

  /api/scan:
    post:
      summary: Upload image for recipe OCR and parsing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageData: { type: string, description: 'data URL (base64) of image' }
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: parsed recipe
          content:
            application/json:
              schema:
                type: object
                properties:
                  menuItemName: { type: string }
                  category: { type: string }
                  price: { type: number }
                  ingredients:
                    type: array
                    items: { type: string }
        '400': { description: bad request, content: { 'application/json': { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/scan-invoice:
    post:
      summary: Upload image for invoice OCR and parsing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageData: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: parsed invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractedInvoice' }
        '400': { description: bad request, content: { 'application/json': { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/forecasts:
    get:
      summary: List forecasts
      responses:
        '200': { content: { 'application/json': { schema: { type: object, properties: { forecasts: { type: array } } } } } }

tags:
  - name: inventory
  - name: recipes
  - name: orders
  - name: ai

externalDocs:
  description: WebSocket realtime spec (connect to receive `aiOrder` messages)
  url: 'http://localhost:4001'
